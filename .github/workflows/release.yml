name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Release after publish
      id-token: write # OIDC for npm publish --provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - run: npm test
      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node --print 'require("./package.json").version')"
          if [[ "$tag" != "$pkg" ]]; then
            echo "tag v$tag != package.json version $pkg"
            exit 1
          fi
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
